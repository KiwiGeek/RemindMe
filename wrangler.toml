name = "remindme"
main = "src/index.ts"
compatibility_date = "2025-01-15"
compatibility_flags = ["nodejs_compat"]
workers_dev = true

# Custom domain binding lives in the Cloudflare dashboard, not in this
# file — set it under Workers & Pages → <worker> → Settings → Triggers
# → Custom Domains. Keeping it out of `wrangler.toml` lets this repo
# stay generic (no hostname leak) while the dashboard config persists
# across deploys.

# Static SPA assets are served from this directory. The SPA build step
# (`npm run build:web`) populates it before deploys.
[assets]
directory = "./web/dist"
binding = "ASSETS"
not_found_handling = "single-page-application"

# Plaintext, non-secret defaults used before setup completes (overridden by
# app_settings afterward). Secrets: INSTANCE_SECRET + SETUP_TOKEN only.
[vars]
APP_NAME = "Remind Me"
MAILGUN_REGION = "us"

# Secrets (set via `wrangler secret put <NAME>`):
#   INSTANCE_SECRET  - seals encrypted app_settings (required)
#   SETUP_TOKEN      - gates first-run wizard / empty import (required until setup)

# D1 binding. The database is created with:
#   npx wrangler d1 create remindme
# then paste the returned id below.
[[d1_databases]]
binding = "DB"
database_name = "remindme"
database_id = "ea8256b9-bcd7-4d53-839d-cddcc6da1d94"
migrations_dir = "migrations"

# KV namespace for OTPs and rate-limit counters. Create with:
#   npx wrangler kv namespace create KV
# and paste the returned id below.
[[kv_namespaces]]
binding = "KV"
id = "0025dd3db7864577ab726877e31ee15a"

# 1-minute scheduler tick.
[triggers]
# Cloudflare Workers free tier guarantees ~5-minute cron granularity. The
# scheduler queries a 6-minute look-ahead window so reminders always fire on
# or before their scheduled minute even when ticks jitter slightly late.
crons = ["*/5 * * * *"]

[observability.logs]
enabled = true
