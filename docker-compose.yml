# Remind Me — Docker Compose
#
#   cp .env.example .env   # set INSTANCE_SECRET + SETUP_TOKEN
#   docker compose up -d
#
# Then open http://localhost:8080 and complete the setup wizard
# (or import a passphrase-wrapped export).

services:
  remindme:
    build: .
    ports:
      - "8080:8080"
    environment:
      INSTANCE_SECRET: ${INSTANCE_SECRET}
      SETUP_TOKEN: ${SETUP_TOKEN:-}
      DATABASE_PATH: /data/remindme.sqlite
      PORT: "8080"
      TRUST_PROXY: ${TRUST_PROXY:-1}
      TLS_CERT_PATH: ${TLS_CERT_PATH:-}
      TLS_KEY_PATH: ${TLS_KEY_PATH:-}
    volumes:
      - ./data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/api/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
